name: Stage production package on Rumahweb
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main build run ID from the preview workflow
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the selected build run
        id: build
        shell: bash
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          python tools/release_candidate.py run build-run.json "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Download and verify its immutable production package
        id: package
        shell: bash
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "araya-production-$BUILD_SHA" --dir payload
          python tools/release_candidate.py package payload "$BUILD_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload into private staging and verify remote checksums
        shell: bash
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          ARCHIVE_SHA: ${{ steps.package.outputs.archive_sha }}
          MANIFEST_SHA: ${{ steps.package.outputs.manifest_sha }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: bash tools/stage_release.sh
